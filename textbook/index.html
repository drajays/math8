<style>

  --glass:rgba(255,255,255,.88);--border:rgba(30,41,59,.1);

.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:16px 18px}
.chap-list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* ========== NOTES — rich reader UI ========== */
.notes-md{font-size:16px;max-height:72vh;overflow:auto;padding:4px 8px 4px 2px;scroll-behavior:smooth}
.notes-md::-webkit-scrollbar{width:8px}

.notes-doc{font-family:var(--serif);color:var(--on);line-height:1.72}

.notes-title{font-family:var(--serif);font-size:clamp(1.45rem,3vw,1.85rem);font-weight:700;margin:0 0 14px;line-height:1.25;color:#fff}

.notes-toc-link{font-family:var(--sans);font-size:12px;font-weight:600;text-decoration:none;color:var(--blue);background:var(--blue-soft);padding:5px 11px;border-radius:var(--pill);transition:transform .12s,background .12s}

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let MANIFEST = null, CUR = null, CACHE = {}, QIDX = 0, REVEAL = 0, LOAD_TOKEN = 0;
let CUR_QUESTIONS = [], Q_FILTER = "all", Q_SEARCH = "";

function safeStr(v){ return v == null ? "" : String(v); }
const TYPE_LABEL = { mcq: "MCQ", fill_blank: "Fill", true_false: "T/F" };
const OPT_LABELS = "ABCDEF";

function texHtml(tex){ return MathRender.render(safeStr(tex)); }
const RDEPS = { esc, texHtml };

function splitRenderTex(text){
  return NotesRender.splitRenderTex(text, RDEPS);
}

function inlineFmt(text){
  return NotesRender.inlineFmt(text, esc);
}

function notesHtml(md){
  return NotesRender.notesToHtml(md, RDEPS);
}

function wireNotesNav(container){
  if (!container) return;
  container.querySelectorAll(".notes-toc-link").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const id = a.getAttribute("href").slice(1);
      const target = container.querySelector("#" + CSS.escape(id));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
}

function cleanQuestionText(q){
  return safeStr(q).replace(/^\[\d+\]\s*/, "");
}

function mdToHtml(md){
  const lines = safeStr(md).split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    if (/^\* /.test(line)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${splitRenderTex(line.slice(2))}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    const t = line.trim();
    if (!t) { html += "<br>"; continue; }
    if (t === "---") { html += "<hr>"; continue; }
    const h3 = line.match(/^### (.+)$/);
    if (h3) { html += `<h3>${splitRenderTex(h3[1])}</h3>`; continue; }
    const h2 = line.match(/^## (.+)$/);
    if (h2) { html += `<h2>${splitRenderTex(h2[1])}</h2>`; continue; }
    const h1 = line.match(/^# (.+)$/);
    if (h1) { html += `<h1>${splitRenderTex(h1[1])}</h1>`; continue; }
    html += `<p>${splitRenderTex(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function plainToHtml(text){
  return safeStr(text).split("\n").map(line => line ? `<p>${splitRenderTex(line)}</p>` : "").join("");
}

/** Repo root e.g. https://drajays.github.io/math8/ — works with or without trailing slash on /textbook */
function repoRoot(){
  const path = location.pathname;
  const i = path.indexOf("/textbook");
  const rootPath = i >= 0 ? path.slice(0, i + 1) : path.replace(/\/[^/]*$/, "/");
  return location.origin + rootPath;
}
function appBase(){
  const path = location.pathname;
  const i = path.indexOf("/textbook");
  const base = i >= 0 ? path.slice(0, i + "/textbook/".length) : path.replace(/\/[^/]*$/, "/");
  return location.origin + base;
}
function resolveUrl(path){
  if (path == null || path === "") throw new Error("Missing asset path in manifest");
  if (/^https?:\/\//i.test(path)) return path;
  const clean = safeStr(path).replace(/^\.\.\//, "");
  if (clean.startsWith("data/")) return repoRoot() + clean;
  if (clean.startsWith("textbook/")) return repoRoot() + clean;
  return appBase() + clean.replace(/^\//, "");
}

function normQuestions(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(q => ({
    ...q,
    question: safeStr(q.question),
    answer: q.answer == null ? "" : q.answer,
    options: Array.isArray(q.options) ? q.options.map(o => safeStr(o)) : [],
    glassboxSteps: Array.isArray(q.glassboxSteps) ? q.glassboxSteps.map(s => ({
      rule: safeStr(s.rule || "Step"),
      why: safeStr(s.why),
      math: safeStr(s.math),
    })) : [],
  }));
}

function normOneWord(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(c => ({ ...c, term: safeStr(c.term), answer: safeStr(c.answer) }));
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function loadText(url){
  const r = await fetch(resolveUrl(url)); if(!r.ok) throw new Error(resolveUrl(url) + " → " + r.status); return r.text();
}
async function loadJson(url){
  const r = await fetch(resolveUrl(url)); if(!r.ok) throw new Error(resolveUrl(url) + " → " + r.status); return r.json();
}

function chapterPaths(tag){
  const p = "data/chapters/chapter_" + tag + "_";
  return {
    questions: p + "questions.json",
    facts: p + "facts.json",
    notes: p + "notes.md",
    mindmap: p + "mindmap.md",
    cheatsheet: p + "cheatsheet.md",
    oneword: p + "oneword.json",
  };
}

async function loadChapter(ch){
  if(CACHE[ch.tag]) return CACHE[ch.tag];
  const tag = safeStr(ch.tag || String(ch.num).padStart(2, "0"));
  const f = chapterPaths(tag);
  const [questions, facts, notes, mindmap, cheat, oneword] = await Promise.all([
    loadJson(f.questions), loadJson(f.facts), loadText(f.notes),
    loadText(f.mindmap), loadText(f.cheatsheet), loadJson(f.oneword)
  ]);
  CACHE[ch.tag] = {
    questions: normQuestions(questions),
    facts: Array.isArray(facts) ? facts : [],
    notes: safeStr(notes),
    mindmap: safeStr(mindmap),
    cheat: safeStr(cheat),
    oneword: normOneWord(oneword),
  };
  return CACHE[ch.tag];
}

function paintChapters(){
  const root = $('#chap-list'); root.innerHTML = '';
  MANIFEST.chapters.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'chap-btn' + (CUR && CUR.num===ch.num ? ' active':'');
    b.innerHTML = `<span class="n">Ch ${ch.num}</span>${esc(ch.title)}`;
    b.onclick = () => selectChapter(ch);
    root.appendChild(b);
  });
}

async function selectChapter(ch){
  const token = ++LOAD_TOKEN;
  CUR = ch; QIDX = 0;
  paintChapters();
  $("#ch-title").textContent = `Ch ${ch.num}: ${ch.title}`;
  $("#notes").innerHTML = '<div class="empty">Loading…</div>';
  try {
    const data = await loadChapter(ch);
    if (token !== LOAD_TOKEN) return;
    const notesEl = $("#notes");
    notesEl.innerHTML = notesHtml(data.notes);
    notesEl.classList.remove("empty");
    wireNotesNav(notesEl);
    notesEl.scrollTop = 0;
    $("#mindmap").innerHTML = plainToHtml(data.mindmap); $("#mindmap").classList.remove("empty");
    $("#cheat").innerHTML = mdToHtml(data.cheat); $("#cheat").classList.remove("empty");
    CUR_QUESTIONS = data.questions;
    Q_FILTER = "all"; Q_SEARCH = "";
    if ($("#q-search")) $("#q-search").value = "";
    paintQuestionFilters(data.questions);
    paintQuestions(data.questions);
    paintOneWord(data.oneword);
  } catch(e){
    if (token !== LOAD_TOKEN) return;
    console.error(e);
    $("#notes").innerHTML = `<div class="empty">Failed to load chapter data.<br><small>${esc(safeStr(e.message || e))}</small></div>`;
  }
}

function filteredQuestions(qs){
  const q = Q_SEARCH.trim().toLowerCase();
  return qs.filter(item => {
    if (Q_FILTER !== "all" && item.type !== Q_FILTER) return false;
    if (!q) return true;
    const hay = (item.id + " " + cleanQuestionText(item.question)).toLowerCase();
    return hay.includes(q);
  });
}

function paintQuestionFilters(qs){
  const root = $("#q-filters");
  if (!root) return;
  const counts = { all: qs.length, mcq: 0, fill_blank: 0, true_false: 0 };
  qs.forEach(q => { if (counts[q.type] != null) counts[q.type]++; });
  root.innerHTML = "";
  ["all", "mcq", "fill_blank", "true_false"].forEach(key => {
    const b = document.createElement("button");
    b.className = "q-chip" + (Q_FILTER === key ? " active" : "");
    b.textContent = (key === "all" ? "All" : TYPE_LABEL[key]) + " (" + counts[key] + ")";
    b.onclick = () => { Q_FILTER = key; QIDX = 0; paintQuestions(CUR_QUESTIONS); };
    root.appendChild(b);
  });
}

function paintQuestions(qs){
  if (!Array.isArray(qs) || !qs.length){
    $("#q-list").innerHTML = "";
    $("#glass-host").innerHTML = '<div class="empty">No questions in this chapter.</div>';
    $("#q-meta").textContent = "0 questions";
    return;
  }
  const visible = filteredQuestions(qs);
  if (!visible.length){
    $("#q-list").innerHTML = '<div class="empty">No questions match your filter.</div>';
    $("#glass-host").innerHTML = '<div class="empty">Adjust search or filter.</div>';
    $("#q-meta").textContent = `0 of ${qs.length} shown`;
    return;
  }
  const sel = visible.find(q => qs.indexOf(q) === QIDX) || visible[0];
  QIDX = qs.indexOf(sel);
  const types = { mcq: 0, fill_blank: 0, true_false: 0 };
  qs.forEach(q => types[q.type] = (types[q.type] || 0) + 1);
  $("#q-meta").textContent = `${visible.length} of ${qs.length} shown · ${types.mcq||0} MCQ · ${types.fill_blank||0} fill · ${types.true_false||0} T/F`;
  const list = $("#q-list"); list.innerHTML = "";
  visible.forEach(q => {
    const i = qs.indexOf(q);
    const d = document.createElement("div");
    d.className = "q-item" + (i === QIDX ? " active" : "");
    d.innerHTML = `<div class="q-meta">
        <span class="q-id">${esc(q.id)}</span>
        <span class="q-type ${esc(q.type)}">${esc(TYPE_LABEL[q.type] || q.type)}</span>
      </div>
      <div class="q-preview">${splitRenderTex(cleanQuestionText(q.question))}</div>`;
    d.onclick = () => { QIDX = i; paintQuestions(qs); showGlass(q); };
    list.appendChild(d);
  });
  showGlass(qs[QIDX]);
}

function showGlass(q){
  if (!q) return;
  const host = $("#glass-host");
  let opts = "";
  if (q.type === "mcq" && q.options && q.options.length) {
    opts = `<ul class="opts">${q.options.map((o, i) =>
      `<li class="opt${i === q.correctOption ? " correct" : ""}">
        <span class="ol">${OPT_LABELS[i] || i + 1}.</span>
        <span class="mathline">${splitRenderTex(o)}</span>
        ${i === q.correctOption ? '<span class="mark">✓</span>' : ""}
      </li>`
    ).join("")}</ul>`;
  }
  host.innerHTML = `
    <div class="problem"><div class="mathline">${splitRenderTex(cleanQuestionText(q.question))}</div></div>
    ${opts}
    <ol class="steps" id="steps">${(q.glassboxSteps || []).map((s, i) =>
      `<li class="step" data-i="${i}"><span class="num">${i + 1}</span><span class="rule">${esc(s.rule)}</span><div class="why">${esc(s.why)}</div><div class="math mathline">${splitRenderTex(s.math)}</div></li>`
    ).join("")}</ol>
    <button class="btn" id="btn-next">Reveal next step ↓</button>
    <div class="answer" id="ans" style="display:none"><span class="mathline">Answer: ${splitRenderTex(q.answer)}</span></div>
    <div class="meta">Linked note: ${esc(safeStr(q.linked_note_id))}</div>`;
  REVEAL = 0; applyReveal();
  $("#btn-next").onclick = () => { REVEAL++; applyReveal(); };
}

function applyReveal(){
  const steps = $$('#steps .step');
  steps.forEach((s,i)=> s.classList.toggle('pending', i>REVEAL));
  const ans = $('#ans');
  if(ans) ans.style.display = REVEAL >= steps.length-1 ? 'block' : 'none';
  if($('#btn-next')) $('#btn-next').style.display = REVEAL >= steps.length-1 ? 'none' : 'inline-block';
}

function paintOneWord(cards){
  const g = $('#ow-grid'); g.innerHTML = '';
  cards.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ow-card'; d.textContent = c.term;
    d.onclick = () => { $('#ow-reveal').innerHTML = `<strong>${esc(c.term)}</strong><br>${splitRenderTex(c.answer)}`; };
    g.appendChild(d);
  });
}

$("#q-search")?.addEventListener("input", e => {
  Q_SEARCH = e.target.value;
  QIDX = 0;
  if (CUR_QUESTIONS.length) paintQuestions(CUR_QUESTIONS);
});

$$('#tabs .tab').forEach(t => t.onclick = () => {
  $$('#tabs .tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $$('.panel').forEach(p=>p.classList.remove('active'));
  $('#panel-'+t.dataset.tab).classList.add('active');
});

(async function boot(){
  try {
    MANIFEST = await loadJson("manifest.json?v=4");
    paintChapters();
    if(MANIFEST.chapters.length) selectChapter(MANIFEST.chapters[0]);
  } catch(e) {
    console.error(e);
    $('#chap-list').innerHTML = `<div class="empty">Could not load manifest.<br><small>${esc(String(e.message||e))}</small></div>`;
    $('#notes').innerHTML = '<div class="empty">Check that data/chapters/ is deployed alongside this app.</div>';
  }
})();
</script>
</body>
