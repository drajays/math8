<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICSE Class 8 Maths · Aggarwal · Glass-Box</title>
<script>
/* GitHub Pages: /math8/textbook (no slash) breaks ../ relative fetches — normalize first */
(function(){
  var p = location.pathname;
  if (/\/textbook$/i.test(p)) location.replace(p + "/" + location.search + location.hash);
})();
</script>
<style>
:root{
  --serif:"Iowan Old Style",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --bg:#f0f4f8;--surface:#fff;--on:#191c1e;--on-var:#45474c;--on-dim:#75777d;
  --primary:#0e1b2e;--crimson:#ba0035;--crimson-soft:#fde2e8;
  --blue:#1d6fa5;--blue-soft:#e3eefb;--emerald:#0f7a55;--emerald-soft:#dff3ea;
  --glass:rgba(255,255,255,.88);--border:rgba(30,41,59,.1);
  --r:.55rem;--r-lg:1rem;--pill:999px;--shadow:0 8px 28px -16px rgba(14,27,46,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--on);background:linear-gradient(160deg,#eef2ff 0%,var(--bg) 35%,#fdf2f8 100%);min-height:100vh;line-height:1.55}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px;transition:max-width .25s}
.wrap.sidebar-collapsed{max-width:1480px}

.grid{display:grid;grid-template-columns:var(--sidebar-w,260px) 1fr;gap:20px;align-items:start;transition:grid-template-columns .25s ease}
.grid.sidebar-collapsed{--sidebar-w:52px}
@media(max-width:900px){
  .grid,.grid.sidebar-collapsed{grid-template-columns:1fr}
  .sidebar-toggle{display:none}
  .sidebar-collapsed .sidebar-body{display:block!important;opacity:1!important;height:auto!important}
  .sidebar-collapsed .sidebar-title{display:inline!important}
}

/* —— Collapsible chapter sidebar —— */
.sidebar{min-width:0;transition:opacity .2s}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-toggle{flex-shrink:0;width:32px;height:32px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;line-height:1;color:var(--on-var);display:grid;place-items:center;transition:transform .25s,background .15s,border-color .15s}
.sidebar-toggle:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.grid.sidebar-collapsed .sidebar-toggle{transform:rotate(180deg)}
.sidebar-body{transition:opacity .2s,max-height .25s}
.grid.sidebar-collapsed .sidebar-body{opacity:0;max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none}
.grid.sidebar-collapsed .sidebar-title{font-size:0;width:0;overflow:hidden}
.grid.sidebar-collapsed .sidebar-head{flex-direction:column;justify-content:flex-start;padding:12px 6px;gap:10px;min-height:100px}
.grid.sidebar-collapsed .sidebar-head::after{content:"Chapters";font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dim);writing-mode:vertical-rl;transform:rotate(180deg);flex:1;display:flex;align-items:center;justify-content:center}
.app-header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-bottom:22px;padding:18px 22px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.back{font-size:14px;color:var(--on-var);text-decoration:none;padding:6px 12px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--border);transition:background .15s}
.back:hover{background:var(--blue-soft)}
.brand{font-family:var(--serif);font-weight:700;font-size:clamp(1.35rem,3vw,1.75rem);color:var(--crimson);flex:1;min-width:200px}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--on-dim);margin-top:4px;font-weight:500}

/* —— Cards —— */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(10px);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(99,102,241,.08),transparent)}
.card-body{padding:16px 18px}
.chap-list{display:flex;flex-direction:column;gap:5px;max-height:72vh;overflow:auto;padding-right:4px}
.chap-list::-webkit-scrollbar{width:6px}
.chap-list::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:var(--pill)}
.chap-btn{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid transparent;background:var(--surface);border-radius:var(--r);padding:8px 10px;cursor:pointer;font-size:13px;transition:all .15s;width:100%}
.chap-btn:hover{border-color:var(--ch-accent,#6366f1);background:var(--ch-soft,#eef2ff);transform:translateX(2px)}
.chap-btn.active{border-color:var(--ch-accent,#6366f1);background:var(--ch-soft,#eef2ff);box-shadow:0 2px 10px color-mix(in srgb,var(--ch-accent) 20%,transparent)}
.chap-num{flex-shrink:0;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ch-accent,#6366f1),color-mix(in srgb,var(--ch-accent) 70%,#000));color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center}
.chap-label{font-weight:600;line-height:1.3;color:var(--on)}
.ch-title-wrap{font-family:var(--serif);font-size:1.05rem}

/* —— Tabs —— */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;padding:4px;background:var(--bg);border-radius:var(--pill);border:1px solid var(--border)}
.tab{border:none;background:transparent;border-radius:var(--pill);padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--on-var);transition:all .15s;font-family:var(--sans)}
.tab:hover{background:var(--surface);color:var(--on)}
.tab.active{color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tab[data-tab="notes"].active{background:linear-gradient(135deg,#6366f1,#4338ca)}
.tab[data-tab="practice"].active{background:linear-gradient(135deg,#e11d48,#be123c)}
.tab[data-tab="mindmap"].active{background:linear-gradient(135deg,#0d9488,#0f766e)}
.tab[data-tab="cheat"].active{background:linear-gradient(135deg,#d97706,#b45309)}
.tab[data-tab="oneword"].active{background:linear-gradient(135deg,#7c3aed,#6d28d9)}

.panel{display:none}.panel.active{display:block}
.panel-scroll{max-height:72vh;overflow:auto;scroll-behavior:smooth;padding:2px 4px 2px 0}
.panel-scroll::-webkit-scrollbar{width:8px}
.panel-scroll::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:var(--pill)}

/* —— Shared panel heroes —— */
.panel-hero{border-radius:calc(var(--r-lg) + 2px);padding:20px 22px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden}
.panel-hero::after{content:"";position:absolute;top:-30%;right:-5%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.panel-hero-inner{display:flex;align-items:flex-start;gap:14px;position:relative;z-index:1}
.panel-hero-icon{font-size:1.75rem;line-height:1;flex-shrink:0}
.panel-hero-badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:var(--pill);margin-bottom:6px}
.panel-hero-title{font-family:var(--serif);font-size:1.2rem;font-weight:700;margin:0 0 4px;line-height:1.3}
.panel-hero-sub{margin:0;font-size:13px;opacity:.9;line-height:1.45}
.panel-hero--practice{background:linear-gradient(135deg,#9f1239,#e11d48 50%,#fb7185)}
.panel-hero--mindmap{background:linear-gradient(135deg,#115e59,#0d9488 50%,#2dd4bf)}
.panel-hero--cheat{background:linear-gradient(135deg,#92400e,#d97706 50%,#fbbf24)}
.panel-hero--oneword{background:linear-gradient(135deg,#5b21b6,#7c3aed 50%,#a78bfa)}

.empty-state,.empty{color:var(--on-dim);padding:24px 16px;text-align:center;font-size:15px}

/* ========== NOTES — rich reader UI ========== */
.notes-md{font-size:16px;max-height:72vh;overflow:auto;padding:4px 8px 4px 2px;scroll-behavior:smooth}
.notes-md::-webkit-scrollbar{width:8px}
.notes-md::-webkit-scrollbar-thumb{background:rgba(99,102,241,.35);border-radius:var(--pill)}
.notes-doc{font-family:var(--serif);color:var(--on);line-height:1.72}
.notes-hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 35%,#4338ca 70%,#6366f1 100%);color:#fff;border-radius:calc(var(--r-lg) + 2px);padding:28px 30px 26px;margin-bottom:18px;box-shadow:0 12px 40px -12px rgba(49,46,129,.55);position:relative;overflow:hidden}
.notes-hero::after{content:"";position:absolute;top:-40%;right:-10%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);pointer-events:none}
.notes-hero-badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:var(--pill);margin-bottom:12px;backdrop-filter:blur(4px)}
.notes-title{font-family:var(--serif);font-size:clamp(1.45rem,3vw,1.85rem);font-weight:700;margin:0 0 14px;line-height:1.25;color:#fff}
.notes-title .mathline{color:#fff}
.notes-summary{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-lg);padding:14px 16px;backdrop-filter:blur(6px)}
.notes-summary-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.notes-summary p{margin:0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.95)}
.notes-summary em{font-style:italic;color:#fde68a}
.notes-toc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.notes-toc-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dim);margin-bottom:8px}
.notes-toc-links{display:flex;flex-wrap:wrap;gap:6px}
.notes-toc-link{font-family:var(--sans);font-size:12px;font-weight:600;text-decoration:none;color:var(--blue);background:var(--blue-soft);padding:5px 11px;border-radius:var(--pill);transition:transform .12s,background .12s}
.notes-toc-link:hover{background:#cce0f5;transform:translateY(-1px)}
.note-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);border-left:5px solid var(--sec-accent,#6366f1)}
.note-section-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;background:linear-gradient(90deg,var(--sec-soft,#eef2ff) 0%,var(--surface) 85%);border-bottom:1px solid var(--border)}
.note-section-icon{font-size:1.35rem;line-height:1;flex-shrink:0;margin-top:2px}
.note-section-titles{flex:1;min-width:0}
.note-section-title{font-family:var(--serif);font-size:1.15rem;font-weight:700;margin:0 0 6px;color:var(--primary);line-height:1.35}
.note-id-pill{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--sec-accent,#6366f1);background:var(--sec-soft,#eef2ff);padding:3px 9px;border-radius:var(--pill);border:1px solid color-mix(in srgb,var(--sec-accent) 25%,transparent)}
.note-section-body{padding:16px 20px 20px;font-size:15.5px}
.note-p{margin:0 0 12px;color:var(--on)}
.note-lead{margin:0 0 10px;font-weight:600;color:var(--on-var);font-size:15px}
.note-h4{font-family:var(--serif);font-size:1.05rem;font-weight:700;margin:16px 0 10px;color:var(--sec-accent,#6366f1)}
.note-table-wrap{margin:14px 0 18px;border-radius:var(--r);overflow:auto;border:1px solid var(--border);box-shadow:0 2px 12px rgba(14,27,46,.06)}
.note-table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px;background:var(--surface)}
.note-table thead{background:linear-gradient(180deg,var(--sec-soft,#eef2ff),color-mix(in srgb,var(--sec-soft) 60%,#fff))}
.note-table th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec-accent,#6366f1);padding:10px 14px;text-align:left;border-bottom:2px solid color-mix(in srgb,var(--sec-accent) 30%,transparent)}
.note-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.note-table tbody tr:nth-child(even){background:rgba(99,102,241,.04)}
.note-table tbody tr:hover{background:var(--sec-soft,#eef2ff)}
.note-td-num{font-weight:700;font-family:var(--mono);color:var(--sec-accent,#6366f1);width:3.5em}
.note-table-caption{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--on-var);margin:12px 0 6px;padding-left:2px}
.note-math-block{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid var(--border);border-left:4px solid var(--sec-accent,#6366f1);border-radius:var(--r);padding:14px 18px;margin:12px 0;font-size:17px;text-align:center;overflow-x:auto}
.note-math-block--inline{text-align:left;margin:6px 0}
.note-callout{border-radius:var(--r);padding:12px 14px 12px 16px;margin:14px 0;border-left:4px solid}
.note-callout--property{background:#fffbeb;border-color:#f59e0b}
.note-callout--example{background:#ecfdf5;border-color:#10b981}
.note-callout-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.note-callout--property .note-callout-badge{color:#b45309}
.note-callout--example .note-callout-badge{color:#047857}
.note-callout-body{font-size:15px;line-height:1.65}
.note-highlight{background:linear-gradient(90deg,#fef3c7,#fff7ed);border:1px solid #fcd34d;border-radius:var(--r);padding:12px 16px;margin:14px 0}
.note-highlight p{margin:0;font-weight:600;color:#92400e}
.note-rule{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--border)}
.note-rule:last-child{border-bottom:none}
.note-rule-label{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--sec-accent,#6366f1);background:var(--sec-soft,#eef2ff);padding:3px 8px;border-radius:6px;white-space:nowrap}
.note-numbered{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:10px 0;border-bottom:1px dashed var(--border)}
.note-num{width:28px;height:28px;border-radius:50%;background:var(--sec-accent,#6366f1);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0}
.note-linked{display:flex;align-items:flex-start;gap:8px;font-family:var(--mono);font-size:11px;color:var(--on-dim);background:var(--bg);padding:10px 12px;border-radius:var(--r);margin-top:12px;line-height:1.5}
.note-linked-icon{flex-shrink:0}
.notes-md code,.note-section-body code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--crimson)}
.notes-md em{color:var(--on-var)}

/* —— Practice panel —— */
.practice-toolbar{margin-bottom:10px}
.practice-q-row{margin-bottom:14px}
.q-list{display:flex;flex-direction:column;gap:6px;max-height:22vh;overflow:auto;padding-right:4px}
.glass-workspace{min-width:0}
.glass-split{display:grid;grid-template-columns:1fr 1fr;min-height:360px;border-top:1px solid var(--border)}
.glass-problem,.glass-solution{padding:16px 18px;overflow-y:auto;max-height:52vh}
.glass-problem{background:linear-gradient(180deg,#fffbfb,#fff);border-right:1px solid var(--border)}
.glass-solution{background:linear-gradient(180deg,#f8fafc,#fff)}
.pane-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dim);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.pane-label::after{content:"";flex:1;height:1px;background:var(--border)}
.glass-problem .pane-label{color:#e11d48}
.glass-solution .pane-label{color:var(--emerald)}
.glass-solution-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.glass-solution-head .pane-label{margin:0;flex:1}
.glass-mode-toggle{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--on-var);cursor:pointer;user-select:none;white-space:nowrap}
.glass-mode-toggle input{accent-color:#e11d48;width:15px;height:15px;cursor:pointer}
.glass-problem .problem{margin-bottom:12px}
.glass-problem .opts{margin-bottom:0}
.glass-solution .steps{margin-bottom:8px}
@media(max-width:900px){
  .glass-split{grid-template-columns:1fr}
  .glass-problem{border-right:none;border-bottom:1px solid var(--border);max-height:none}
  .glass-solution{max-height:none}
}
.q-search{width:100%;font-family:var(--mono);font-size:13px;padding:9px 12px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--surface)}
.q-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.q-toolbar .q-search{flex:1;min-width:160px}
.q-stats{font-family:var(--mono);font-size:11px;color:var(--on-var);background:var(--bg);padding:8px 10px;border-radius:var(--r);line-height:1.5;flex:1;min-width:140px}
.q-search:focus{outline:none;border-color:#e11d48;box-shadow:0 0 0 3px #ffe4e6}
.q-filters{display:flex;flex-wrap:wrap;gap:5px}
.q-chip{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--pill);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono);transition:all .12s}
.q-chip:hover{border-color:#e11d48}
.q-chip.active{background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;border-color:transparent}
.q-item{padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface);transition:all .12s}
.q-item:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(29,111,165,.1)}
.q-item.active{border-color:#e11d48;background:linear-gradient(90deg,#fff1f2,#fff);box-shadow:0 2px 10px rgba(225,29,72,.12)}
.q-item .q-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.q-item .q-id{font-family:var(--mono);font-size:9px;color:var(--on-dim);background:var(--bg);padding:2px 6px;border-radius:4px}
.q-item .q-type{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.q-item .q-type.mcq{background:var(--blue-soft);color:var(--blue)}
.q-item .q-type.fill_blank{background:var(--emerald-soft);color:var(--emerald)}
.q-item .q-type.true_false{background:#fff3e0;color:#b45309}
.q-item .q-preview{font-family:var(--serif);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.glass-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.glass-panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(90deg,#fff1f2,#fff);border-bottom:1px solid var(--border)}
.glass-panel-head .q-id{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--on-var)}
.glass-panel-head .q-type{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:var(--pill)}
.glass-panel-head .q-type.mcq{background:var(--blue-soft);color:var(--blue)}
.glass-panel-head .q-type.fill_blank{background:var(--emerald-soft);color:var(--emerald)}
.glass-panel-head .q-type.true_false{background:#fff3e0;color:#b45309}
.glass-panel-body{padding:0}
.problem{border-left:4px solid #e11d48;background:linear-gradient(90deg,#fff1f2,#fff);padding:14px 16px;border-radius:var(--r);margin-bottom:14px;font-family:var(--serif);font-size:18px;line-height:1.65}
.problem .mathline{line-height:1.7}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;list-style:none;margin:0 0 14px;padding:0}
.opt{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface);font-family:var(--serif);font-size:14px;line-height:1.5;transition:border-color .12s}
.opt:hover{border-color:var(--blue)}
.opt.correct{border-color:var(--emerald);background:var(--emerald-soft);box-shadow:0 2px 8px rgba(15,122,85,.12)}
.opt .ol{font-family:var(--mono);font-weight:700;color:var(--on-var);min-width:1.2em}
.opt .mark{color:var(--emerald);font-weight:700;margin-left:auto}
.steps{list-style:none;margin:0;padding:0}
.step{padding:14px 0 14px 48px;position:relative;border-bottom:1px dashed var(--border)}
.step:last-child{border-bottom:none}
.step .num{position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid #e11d48;background:#fff1f2;display:grid;place-items:center;font-weight:700;font-size:13px;color:#e11d48}
.step .rule{font-family:var(--mono);font-size:10px;text-transform:uppercase;background:#ffe4e6;color:#e11d48;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.step .why{color:var(--on-var);font-size:14px;margin-bottom:6px}
.step .math{font-family:var(--serif);font-size:16px;background:var(--bg);padding:10px 12px;border-radius:var(--r);overflow-x:auto;line-height:1.65;border:1px solid var(--border)}
.step.pending{filter:blur(4px);opacity:.45;pointer-events:none}
.answer{margin-top:12px;padding:14px 16px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #6ee7b7;border-radius:var(--r);font-family:var(--serif);font-size:18px;color:var(--emerald);line-height:1.65}
.btn{border:none;border-radius:var(--r);padding:10px 18px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;margin-top:10px;box-shadow:0 2px 10px rgba(225,29,72,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(225,29,72,.3)}
.glass-link{font-family:var(--mono);font-size:10px;color:var(--on-dim);margin-top:12px;padding:8px 10px;background:var(--bg);border-radius:var(--r)}

/* —— Mind map —— */
.mind-doc,.cheat-doc,.rich-doc{font-family:var(--serif)}
.mind-tree{padding:8px 4px 16px}
.mind-branch{list-style:none;margin:0;padding:0}
.mind-branch--0{padding-left:0}
.mind-branch:not(.mind-branch--0){padding-left:18px;margin-top:6px;border-left:2px solid color-mix(in srgb,var(--sec-accent,#6366f1) 35%,transparent)}
.mind-node{margin:6px 0;padding-left:8px}
.mind-node-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--sec-accent,#6366f1);border-radius:var(--r);padding:10px 14px;font-size:14px;line-height:1.55;box-shadow:0 2px 8px rgba(14,27,46,.04);transition:transform .12s,box-shadow .12s}
.mind-node-card:hover{transform:translateX(3px);box-shadow:0 4px 14px rgba(14,27,46,.08)}
.mind-node--root>.mind-node-card{background:linear-gradient(90deg,var(--sec-soft,#eef2ff),var(--surface));font-weight:700;font-size:15px}

/* —— Cheat sheet —— */
.cheat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:16px}
.cheat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;border-top:4px solid var(--sec-accent,#6366f1);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .12s,box-shadow .12s}
.cheat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,27,46,.1)}
.cheat-num{align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--sec-accent,#6366f1);background:var(--sec-soft,#eef2ff);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.cheat-body{font-size:14px;line-height:1.55;flex:1}

/* —— One word flashcards —— */
.ow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.ow-card{padding:16px 10px;border:2px solid var(--card-accent,#7c3aed);border-radius:var(--r-lg);background:linear-gradient(145deg,var(--card-soft,#ede9fe),#fff);cursor:pointer;text-align:center;font-weight:700;font-size:14px;font-family:var(--serif);color:var(--primary);min-height:72px;display:grid;place-items:center;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px color-mix(in srgb,var(--card-accent) 15%,transparent)}
.ow-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 20px color-mix(in srgb,var(--card-accent) 25%,transparent)}
.ow-card:nth-child(8n+1){--card-accent:#6366f1;--card-soft:#eef2ff}
.ow-card:nth-child(8n+2){--card-accent:#0d9488;--card-soft:#ccfbf1}
.ow-card:nth-child(8n+3){--card-accent:#d97706;--card-soft:#fef3c7}
.ow-card:nth-child(8n+4){--card-accent:#e11d48;--card-soft:#ffe4e6}
.ow-card:nth-child(8n+5){--card-accent:#7c3aed;--card-soft:#ede9fe}
.ow-card:nth-child(8n+6){--card-accent:#0284c7;--card-soft:#e0f2fe}
.ow-card:nth-child(8n+7){--card-accent:#059669;--card-soft:#d1fae5}
.ow-card:nth-child(8n+8){--card-accent:#db2777;--card-soft:#fce7f3}
.ow-reveal{padding:18px 20px;background:linear-gradient(135deg,#ede9fe,#fff);border:2px solid #7c3aed;border-radius:var(--r-lg);min-height:64px;font-size:15px;line-height:1.6;box-shadow:0 4px 16px rgba(124,58,237,.12)}
.ow-reveal strong{display:block;font-family:var(--serif);font-size:1.15rem;color:#5b21b6;margin-bottom:8px}
.ow-reveal-hint{color:var(--on-dim);font-style:italic;text-align:center}
/* math rendering */
.mathline,.math,.problem .mathline{line-height:1.7}
.mfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em}
.mfrac .mnum{border-bottom:1.4px solid currentColor;padding:0 .35em 1px}
.mfrac .mden{padding:1px .35em 0}
.msqrt{display:inline-flex;align-items:flex-start}
.msqrt .mroot{font-size:.62em;transform:translateY(-.15em);margin-right:-.28em;font-family:var(--mono)}
.msqrt .mradsign{transform:scaleY(1.25);display:inline-block;margin-right:1px}
.msqrt .mrad{border-top:1.4px solid currentColor;padding:1px .14em 0}
.msup,.msub{font-size:.72em;font-family:inherit}
.msub{vertical-align:sub}
.mtext{font-family:var(--sans);font-size:.9em;font-style:normal}
.mvar{font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <a class="back" href="../">← math8 apps</a>
    <div class="brand">Understanding Mathematics<small>ICSE CLASS 8 · M.L. AGGARWAL · GLASS-BOX</small></div>
  </header>
  <div class="grid" id="app-grid">
    <aside class="card sidebar" id="chapter-sidebar">
      <div class="card-head sidebar-head">
        <span class="sidebar-title">📚 Chapters</span>
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="Collapse chapters panel" aria-expanded="true" aria-controls="sidebar-body">◀</button>
      </div>
      <div class="card-body sidebar-body" id="sidebar-body">
        <div class="chap-list" id="chap-list"></div>
      </div>
    </aside>
    <div class="card">
      <div class="card-head ch-title-wrap"><span id="ch-title">Select a chapter</span></div>
      <div class="card-body">
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="notes">📝 Notes</button>
          <button class="tab" data-tab="practice">❓ Practice</button>
          <button class="tab" data-tab="mindmap">🧠 Mind Map</button>
          <button class="tab" data-tab="cheat">⚡ Cheat Sheet</button>
          <button class="tab" data-tab="oneword">🔤 One Word</button>
        </div>
        <div class="panel active" id="panel-notes"><div class="panel-scroll notes-md empty" id="notes">Pick a chapter.</div></div>
        <div class="panel" id="panel-practice">
          <div class="panel-scroll" id="practice-scroll">
            <div id="practice-hero"></div>
            <div class="practice-toolbar">
              <div class="q-stats" id="q-meta">Select a chapter to practice.</div>
              <div class="q-toolbar">
                <input class="q-search" id="q-search" type="search" placeholder="Search questions…" autocomplete="off">
                <div class="q-filters" id="q-filters"></div>
              </div>
            </div>
            <div class="practice-q-row"><div class="q-list" id="q-list"></div></div>
            <main class="glass-workspace" id="glass-host"><div class="empty-state">Select a question for glass-box derivation.</div></main>
          </div>
        </div>
        <div class="panel" id="panel-mindmap"><div class="panel-scroll mindmap empty" id="mindmap"></div></div>
        <div class="panel" id="panel-cheat"><div class="panel-scroll cheat empty" id="cheat"></div></div>
        <div class="panel" id="panel-oneword">
          <div class="panel-scroll">
            <div id="oneword-hero"></div>
            <div class="ow-grid" id="ow-grid"></div>
            <div class="ow-reveal ow-reveal-hint" id="ow-reveal">Tap a card to reveal the answer.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../shared/math-render.js?v=3"></script>
<script src="../shared/notes-render.js?v=3"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let MANIFEST = null, CUR = null, CACHE = {}, QIDX = 0, REVEAL = 0, LOAD_TOKEN = 0;
let CUR_QUESTIONS = [], Q_FILTER = "all", Q_SEARCH = "";
let GLASS_STEP_MODE = false;

function safeStr(v){ return v == null ? "" : String(v); }
const TYPE_LABEL = { mcq: "MCQ", fill_blank: "Fill", true_false: "T/F" };
const OPT_LABELS = "ABCDEF";

function texHtml(tex){ return MathRender.render(safeStr(tex)); }
const RDEPS = { esc, texHtml };

function splitRenderTex(text){
  return NotesRender.splitRenderTex(text, RDEPS);
}

function inlineFmt(text){
  return NotesRender.inlineFmt(text, esc);
}

function notesHtml(md){
  return NotesRender.notesToHtml(md, RDEPS);
}

function mindMapHtml(md){
  return NotesRender.mindMapHtml(md, RDEPS);
}

function cheatSheetHtml(md){
  return NotesRender.cheatSheetHtml(md, RDEPS);
}

function chapterLabel(ch){
  return "Ch " + ch.num + ": " + ch.title;
}

function paintPanelHero(id, kind, badge, title, subtitle){
  const el = $(id);
  if (el) el.innerHTML = NotesRender.panelHeroHtml(kind, badge, title, subtitle, RDEPS);
}

function wireNotesNav(container){
  if (!container) return;
  container.querySelectorAll(".notes-toc-link").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const id = a.getAttribute("href").slice(1);
      const target = container.querySelector("#" + CSS.escape(id));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
}

function cleanQuestionText(q){
  return safeStr(q).replace(/^\[\d+\]\s*/, "");
}

/** Repo root e.g. https://drajays.github.io/math8/ — works with or without trailing slash on /textbook */
function repoRoot(){
  const path = location.pathname;
  const i = path.indexOf("/textbook");
  const rootPath = i >= 0 ? path.slice(0, i + 1) : path.replace(/\/[^/]*$/, "/");
  return location.origin + rootPath;
}
function appBase(){
  const path = location.pathname;
  const i = path.indexOf("/textbook");
  const base = i >= 0 ? path.slice(0, i + "/textbook/".length) : path.replace(/\/[^/]*$/, "/");
  return location.origin + base;
}
function resolveUrl(path){
  if (path == null || path === "") throw new Error("Missing asset path in manifest");
  if (/^https?:\/\//i.test(path)) return path;
  const clean = safeStr(path).replace(/^\.\.\//, "");
  if (clean.startsWith("data/")) return repoRoot() + clean;
  if (clean.startsWith("textbook/")) return repoRoot() + clean;
  return appBase() + clean.replace(/^\//, "");
}

function normQuestions(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(q => ({
    ...q,
    question: safeStr(q.question),
    answer: q.answer == null ? "" : q.answer,
    options: Array.isArray(q.options) ? q.options.map(o => safeStr(o)) : [],
    glassboxSteps: Array.isArray(q.glassboxSteps) ? q.glassboxSteps.map(s => ({
      rule: safeStr(s.rule || "Step"),
      why: safeStr(s.why),
      math: safeStr(s.math),
    })) : [],
  }));
}

function normOneWord(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(c => ({ ...c, term: safeStr(c.term), answer: safeStr(c.answer) }));
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function loadText(url){
  const r = await fetch(resolveUrl(url)); if(!r.ok) throw new Error(resolveUrl(url) + " → " + r.status); return r.text();
}
async function loadJson(url){
  const r = await fetch(resolveUrl(url)); if(!r.ok) throw new Error(resolveUrl(url) + " → " + r.status); return r.json();
}

function chapterPaths(tag){
  const p = "data/chapters/chapter_" + tag + "_";
  return {
    questions: p + "questions.json",
    facts: p + "facts.json",
    notes: p + "notes.md",
    mindmap: p + "mindmap.md",
    cheatsheet: p + "cheatsheet.md",
    oneword: p + "oneword.json",
  };
}

async function loadChapter(ch){
  if(CACHE[ch.tag]) return CACHE[ch.tag];
  const tag = safeStr(ch.tag || String(ch.num).padStart(2, "0"));
  const f = chapterPaths(tag);
  const [questions, facts, notes, mindmap, cheat, oneword] = await Promise.all([
    loadJson(f.questions), loadJson(f.facts), loadText(f.notes),
    loadText(f.mindmap), loadText(f.cheatsheet), loadJson(f.oneword)
  ]);
  CACHE[ch.tag] = {
    questions: normQuestions(questions),
    facts: Array.isArray(facts) ? facts : [],
    notes: safeStr(notes),
    mindmap: safeStr(mindmap),
    cheat: safeStr(cheat),
    oneword: normOneWord(oneword),
  };
  return CACHE[ch.tag];
}

function paintChapters(){
  const root = $('#chap-list'); root.innerHTML = '';
  MANIFEST.chapters.forEach(ch => {
    const theme = NotesRender.chapterTheme(ch.num);
    const b = document.createElement('button');
    b.className = 'chap-btn' + (CUR && CUR.num===ch.num ? ' active':'');
    b.style.setProperty('--ch-accent', theme.accent);
    b.style.setProperty('--ch-soft', theme.soft);
    b.innerHTML = `<span class="chap-num">${ch.num}</span><span class="chap-label">${esc(ch.title)}</span>`;
    b.onclick = () => selectChapter(ch);
    root.appendChild(b);
  });
}

async function selectChapter(ch){
  const token = ++LOAD_TOKEN;
  CUR = ch; QIDX = 0;
  paintChapters();
  $("#ch-title").textContent = chapterLabel(ch);
  $("#notes").innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const data = await loadChapter(ch);
    if (token !== LOAD_TOKEN) return;
    const notesEl = $("#notes");
    notesEl.innerHTML = notesHtml(data.notes);
    notesEl.classList.remove("empty");
    wireNotesNav(notesEl);
    notesEl.scrollTop = 0;
    $("#mindmap").innerHTML = mindMapHtml(data.mindmap);
    $("#mindmap").classList.remove("empty");
    $("#cheat").innerHTML = cheatSheetHtml(data.cheat);
    $("#cheat").classList.remove("empty");
    paintPanelHero("#practice-hero", "practice", data.questions.length + " questions", chapterLabel(ch), null);
    paintPanelHero("#oneword-hero", "oneword", data.oneword.length + " cards", chapterLabel(ch), null);
    CUR_QUESTIONS = data.questions;
    Q_FILTER = "all"; Q_SEARCH = "";
    if ($("#q-search")) $("#q-search").value = "";
    paintQuestionFilters(data.questions);
    paintQuestions(data.questions);
    paintOneWord(data.oneword);
  } catch(e){
    if (token !== LOAD_TOKEN) return;
    console.error(e);
    $("#notes").innerHTML = `<div class="empty">Failed to load chapter data.<br><small>${esc(safeStr(e.message || e))}</small></div>`;
  }
}

function filteredQuestions(qs){
  const q = Q_SEARCH.trim().toLowerCase();
  return qs.filter(item => {
    if (Q_FILTER !== "all" && item.type !== Q_FILTER) return false;
    if (!q) return true;
    const hay = (item.id + " " + cleanQuestionText(item.question)).toLowerCase();
    return hay.includes(q);
  });
}

function paintQuestionFilters(qs){
  const root = $("#q-filters");
  if (!root) return;
  const counts = { all: qs.length, mcq: 0, fill_blank: 0, true_false: 0 };
  qs.forEach(q => { if (counts[q.type] != null) counts[q.type]++; });
  root.innerHTML = "";
  ["all", "mcq", "fill_blank", "true_false"].forEach(key => {
    const b = document.createElement("button");
    b.className = "q-chip" + (Q_FILTER === key ? " active" : "");
    b.textContent = (key === "all" ? "All" : TYPE_LABEL[key]) + " (" + counts[key] + ")";
    b.onclick = () => { Q_FILTER = key; QIDX = 0; paintQuestions(CUR_QUESTIONS); };
    root.appendChild(b);
  });
}

function paintQuestions(qs){
  if (!Array.isArray(qs) || !qs.length){
    $("#q-list").innerHTML = "";
    $("#glass-host").innerHTML = '<div class="empty-state">No questions in this chapter.</div>';
    $("#q-meta").textContent = "0 questions";
    return;
  }
  const visible = filteredQuestions(qs);
  if (!visible.length){
    $("#q-list").innerHTML = '<div class="empty-state">No questions match your filter.</div>';
    $("#glass-host").innerHTML = '<div class="empty-state">Adjust search or filter.</div>';
    $("#q-meta").textContent = `0 of ${qs.length} shown`;
    return;
  }
  const sel = visible.find(q => qs.indexOf(q) === QIDX) || visible[0];
  QIDX = qs.indexOf(sel);
  const types = { mcq: 0, fill_blank: 0, true_false: 0 };
  qs.forEach(q => types[q.type] = (types[q.type] || 0) + 1);
  $("#q-meta").textContent = `${visible.length} of ${qs.length} shown · ${types.mcq||0} MCQ · ${types.fill_blank||0} fill · ${types.true_false||0} T/F`;
  const list = $("#q-list"); list.innerHTML = "";
  visible.forEach(q => {
    const i = qs.indexOf(q);
    const d = document.createElement("div");
    d.className = "q-item" + (i === QIDX ? " active" : "");
    d.innerHTML = `<div class="q-meta">
        <span class="q-id">${esc(q.id)}</span>
        <span class="q-type ${esc(q.type)}">${esc(TYPE_LABEL[q.type] || q.type)}</span>
      </div>
      <div class="q-preview">${splitRenderTex(cleanQuestionText(q.question))}</div>`;
    d.onclick = () => { QIDX = i; paintQuestions(qs); showGlass(q); };
    list.appendChild(d);
  });
  showGlass(qs[QIDX]);
}

function showGlass(q){
  if (!q) return;
  const host = $("#glass-host");
  let opts = "";
  if (q.type === "mcq" && q.options && q.options.length) {
    opts = `<ul class="opts">${q.options.map((o, i) =>
      `<li class="opt${i === q.correctOption ? " correct" : ""}">
        <span class="ol">${OPT_LABELS[i] || i + 1}.</span>
        <span class="mathline">${splitRenderTex(o)}</span>
        ${i === q.correctOption ? '<span class="mark">✓</span>' : ""}
      </li>`
    ).join("")}</ul>`;
  }
  host.innerHTML = `
    <div class="glass-panel">
      <div class="glass-panel-head">
        <span class="q-id">${esc(q.id)}</span>
        <span class="q-type ${esc(q.type)}">${esc(TYPE_LABEL[q.type] || q.type)}</span>
      </div>
      <div class="glass-panel-body">
        <div class="glass-split">
          <div class="glass-problem">
            <h3 class="pane-label">Problem</h3>
            <div class="problem"><div class="mathline">${splitRenderTex(cleanQuestionText(q.question))}</div></div>
            ${opts}
          </div>
          <div class="glass-solution">
            <div class="glass-solution-head">
              <h3 class="pane-label">Glass-box solution</h3>
              <label class="glass-mode-toggle" title="When off, all steps and the answer are shown">
                <input type="checkbox" id="glass-step-mode"> Step-by-step reveal
              </label>
            </div>
            <ol class="steps" id="steps">${(q.glassboxSteps || []).map((s, i) =>
              `<li class="step" data-i="${i}"><span class="num">${i + 1}</span><span class="rule">${esc(s.rule)}</span><div class="why">${esc(s.why)}</div><div class="math mathline">${splitRenderTex(s.math)}</div></li>`
            ).join("")}</ol>
            <button class="btn" id="btn-next">Reveal next step ↓</button>
            <div class="answer" id="ans"><span class="mathline">Answer: ${splitRenderTex(q.answer)}</span></div>
            <div class="glass-link">Linked note: ${esc(safeStr(q.linked_note_id))}</div>
          </div>
        </div>
      </div>
    </div>`;
  REVEAL = 0;
  wireGlassModeToggle();
  applyReveal();
  $("#btn-next").onclick = () => { REVEAL++; applyReveal(); };
}

function wireGlassModeToggle(){
  const cb = $("#glass-step-mode");
  if (!cb) return;
  cb.checked = GLASS_STEP_MODE;
  cb.onchange = () => {
    GLASS_STEP_MODE = cb.checked;
    REVEAL = 0;
    try { localStorage.setItem("math8-glass-step-mode", GLASS_STEP_MODE ? "1" : "0"); } catch(e){}
    applyReveal();
  };
}

function applyReveal(){
  const steps = $$('#steps .step');
  const ans = $('#ans');
  const btn = $('#btn-next');
  if (!GLASS_STEP_MODE) {
    steps.forEach(s => s.classList.remove('pending'));
    if (ans) ans.style.display = 'block';
    if (btn) btn.style.display = 'none';
    return;
  }
  steps.forEach((s,i)=> s.classList.toggle('pending', i>REVEAL));
  if (ans) ans.style.display = REVEAL >= Math.max(0, steps.length - 1) ? 'block' : 'none';
  if (btn) btn.style.display = REVEAL >= Math.max(0, steps.length - 1) ? 'none' : 'inline-block';
}

function paintOneWord(cards){
  const g = $('#ow-grid'); g.innerHTML = '';
  if (!cards.length) {
    g.innerHTML = '<div class="empty-state">No one-word cards for this chapter.</div>';
    return;
  }
  cards.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ow-card'; d.textContent = c.term;
    d.onclick = () => {
      const rev = $('#ow-reveal');
      rev.classList.remove('ow-reveal-hint');
      rev.innerHTML = `<strong>${esc(c.term)}</strong>${splitRenderTex(c.answer)}`;
    };
    g.appendChild(d);
  });
  const rev = $('#ow-reveal');
  rev.classList.add('ow-reveal-hint');
  rev.textContent = 'Tap a card to reveal the answer.';
}

$("#q-search")?.addEventListener("input", e => {
  Q_SEARCH = e.target.value;
  QIDX = 0;
  if (CUR_QUESTIONS.length) paintQuestions(CUR_QUESTIONS);
});

$$('#tabs .tab').forEach(t => t.onclick = () => {
  $$('#tabs .tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $$('.panel').forEach(p=>p.classList.remove('active'));
  $('#panel-'+t.dataset.tab).classList.add('active');
});

function setSidebarCollapsed(collapsed){
  const grid = $('#app-grid');
  const wrap = $('.wrap');
  const btn = $('#sidebar-toggle');
  if (!grid) return;
  grid.classList.toggle('sidebar-collapsed', collapsed);
  wrap?.classList.toggle('sidebar-collapsed', collapsed);
  if (btn){
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    btn.title = collapsed ? 'Expand chapters panel' : 'Collapse chapters panel';
  }
  try { localStorage.setItem('math8-sidebar-collapsed', collapsed ? '1' : '0'); } catch(e){}
}

$('#sidebar-toggle')?.addEventListener('click', () => {
  setSidebarCollapsed(!$('#app-grid').classList.contains('sidebar-collapsed'));
});

(async function boot(){
  try {
    const saved = localStorage.getItem('math8-sidebar-collapsed');
    if (saved === '1') setSidebarCollapsed(true);
    const glassMode = localStorage.getItem('math8-glass-step-mode');
    if (glassMode === '1') GLASS_STEP_MODE = true;
    MANIFEST = await loadJson("manifest.json?v=4");
    paintChapters();
    if(MANIFEST.chapters.length) selectChapter(MANIFEST.chapters[0]);
  } catch(e) {
    console.error(e);
    $('#chap-list').innerHTML = `<div class="empty">Could not load manifest.<br><small>${esc(String(e.message||e))}</small></div>`;
    $('#notes').innerHTML = '<div class="empty">Check that data/chapters/ is deployed alongside this app.</div>';
  }
})();
</script>
</body>
</html>
